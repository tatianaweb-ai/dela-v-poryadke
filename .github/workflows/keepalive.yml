name: Keep Supabase awake

on:
  schedule:
    # Раз в сутки. Supabase ставит бесплатный проект на паузу после 7 дней
    # без запросов к базе — этот запрос не даёт этому случиться.
    - cron: "23 6 * * *"
  # Ручной запуск со вкладки Actions — удобно для проверки.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database once
        # Ходим напрямую в Supabase, а не через приложение: если хостинг
        # недоступен, база всё равно получит запрос и не уснёт.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/projects?select=id&limit=1"
